services:
  - type: web
    name: zuoxing-ig-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: IG_STUDIO_HOST
        value: 0.0.0.0
      - key: IG_STUDIO_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
